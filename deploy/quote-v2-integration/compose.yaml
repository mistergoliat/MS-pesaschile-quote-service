# Quote V2 — EC2 integration deployment (R1.7B-G1). NOT for customer traffic.
#
# Secrets never live in this file or in Git. Every secret is a host file under
# ${QUOTE_V2_SECRETS_DIR} (mode 0700 dir, 0600 files), created on the host by
# the procedure in README.md. Image: built from 67353522c08a3ccd6357de0298af900debabe056
# with the unchanged repository Dockerfile.
#
#   docker compose -p quote-v2-integration -f compose.yaml up -d
#
# Isolation: own compose project, networks, volumes and container names; the
# database has no published port and sits on an internal (no egress) network;
# HTTP is published on loopback only.

name: quote-v2-integration

services:
  postgres:
    image: postgres:16-alpine
    container_name: quote-v2-integration-postgres
    restart: unless-stopped
    networks: [db]
    # No `ports:` on purpose: reachable only from the internal db network.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/quote-secrets/pg-superuser-password
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/quote-tls/server.crt
      - -c
      - ssl_key_file=/run/quote-tls/server.key
      - -c
      - hba_file=/run/quote-conf/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=40
      - -c
      - shared_buffers=64MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${QUOTE_V2_SECRETS_DIR:?set QUOTE_V2_SECRETS_DIR}/pg-superuser-password:/run/quote-secrets/pg-superuser-password:ro
      - ${QUOTE_V2_SECRETS_DIR}/pg-tls/server.crt:/run/quote-tls/server.crt:ro
      - ${QUOTE_V2_SECRETS_DIR}/pg-tls/server.key:/run/quote-tls/server.key:ro
      - ./pg_hba.conf:/run/quote-conf/pg_hba.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  quote:
    image: quote-v2-integration:6735352
    container_name: quote-v2-integration
    # Capped restarts: class A exits only (docs/runbooks/production-bootstrap.md §4).
    restart: on-failure:5
    depends_on:
      postgres: { condition: service_healthy }
    networks: [db, edge]
    ports:
      - "127.0.0.1:4020:3000"   # loopback only; reach it through an SSH tunnel
    env_file:
      - ./runtime.public.env                         # non-secret settings (in Git)
      - ${QUOTE_V2_SECRETS_DIR}/runtime.secret.env   # DATABASE_URL only (host file)
    volumes:
      - documents:/var/lib/pesaschile/quote-documents
      - ${QUOTE_V2_SECRETS_DIR}/pg-tls/ca.crt:/run/quote-tls/ca.crt:ro
      - ${QUOTE_V2_SECRETS_DIR}/principals.json:/run/quote-secrets/principals.json:ro
    stop_grace_period: 15s      # > APP_SHUTDOWN_TIMEOUT_MS (10 s)
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  db:
    name: quote-v2-integration-db
    internal: true
  edge:
    name: quote-v2-integration-edge

volumes:
  pgdata:
    name: quote-v2-integration-pgdata
  documents:
    name: quote-v2-integration-documents
