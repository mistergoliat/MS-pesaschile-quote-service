# Quote V2 integration PostgreSQL: TLS-only TCP, SCRAM passwords.
# Unix socket (docker exec into the container) is for bootstrap administration.
local     all  all                 trust
hostssl   all  all  0.0.0.0/0      scram-sha-256
hostnossl all  all  0.0.0.0/0      reject
hostssl   all  all  ::/0           scram-sha-256
hostnossl all  all  ::/0           reject
